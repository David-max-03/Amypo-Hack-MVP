openapi: 3.1.0
info:
  title: Code Titans — PS8 + PS2 Question Trust Pipeline
  description: "\n**Code Titans — HackWithAMYPO 2026 Stage 2 MVP**\n\nTwo problem\
    \ statements wired into one pipeline:\n\n* **PS8** — Assignment Question Iteration\
    \ & Variation Generation\n* **PS2** — AI Hallucination Detection & Reliability\
    \ Scoring\n\n```\nseed -> parse -> plan -> generate (Qwen2.5-Coder 7B via Ollama)\n\
    \     -> PS8 structural validation -> PS2 reliability verification\n     -> decision\
    \ -> PASS | REVIEW | REJECT -> (regenerate on REJECT)\n```\n\nEverything runs\
    \ locally. No paid third-party APIs are used anywhere.\n"
  version: 1.0.0
paths:
  /api/v1/health:
    get:
      tags:
      - System
      summary: System health
      description: 'Report what is actually available, so a demo never silently degrades.


        Status is "degraded" (not "ok") whenever generation is impossible or PS2 is

        running on the fallback vectoriser instead of MiniLM.'
      operationId: health_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

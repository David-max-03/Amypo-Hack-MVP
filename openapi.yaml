components:
  schemas:
    Candidate:
      properties:
        id:
          type: string
          title: Id
        question:
          type: string
          title: Question
        answer_key:
          type: string
          title: Answer Key
        domain:
          type: string
          title: Domain
        topic:
          type: string
          title: Topic
        subtopic:
          anyOf:
          - type: string
          - type: 'null'
          title: Subtopic
        difficulty:
          type: string
          enum:
          - easy
          - medium
          - hard
          - expert
          title: Difficulty
        difficulty_score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Difficulty Score
          default: 0.5
        question_type:
          type: string
          title: Question Type
        learning_objective:
          type: string
          title: Learning Objective
        test_cases:
          items:
            $ref: '#/components/schemas/TestCase'
          type: array
          title: Test Cases
        variation_strategy:
          type: string
          title: Variation Strategy
        strategy_label:
          type: string
          title: Strategy Label
          default: ''
        solution_method:
          anyOf:
          - type: string
          - type: 'null'
          title: Solution Method
        attempt:
          type: integer
          title: Attempt
          default: 0
        regenerated:
          type: boolean
          title: Regenerated
          default: false
        raw_model_output:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Model Output
        parse_warnings:
          items:
            type: string
          type: array
          title: Parse Warnings
      type: object
      required:
      - id
      - question
      - answer_key
      - domain
      - topic
      - difficulty
      - question_type
      - learning_objective
      - variation_strategy
      title: Candidate
      description: A generated question candidate before (or after) validation.
    Claim:
      properties:
        text:
          type: string
          title: Text
        claim_type:
          type: string
          enum:
          - factual
          - answer
          - citation
          - assumption
          - opinion
          - inference
          - instruction
          - setup
          - explanation
          title: Claim Type
        start:
          type: integer
          title: Start
        end:
          type: integer
          title: End
      type: object
      required:
      - text
      - claim_type
      - start
      - end
      title: Claim
    DemoRunRequest:
      properties:
        job_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: 'null'
          title: Job Id
      type: object
      title: DemoRunRequest
    DomainInfo:
      properties:
        id:
          type: string
          title: Id
        label:
          type: string
          title: Label
        description:
          type: string
          title: Description
        example_seed:
          type: string
          title: Example Seed
      type: object
      required:
      - id
      - label
      - description
      - example_seed
      title: DomainInfo
    EvidenceItem:
      properties:
        claim:
          type: string
          title: Claim
        supported:
          type: boolean
          title: Supported
        status:
          type: string
          enum:
          - supported
          - partially_supported
          - unsupported
          - contradicted
          title: Status
        similarity:
          type: number
          title: Similarity
        keyword_grounding:
          type: number
          title: Keyword Grounding
        source_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Id
        source_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Title
        source_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Text
      type: object
      required:
      - claim
      - supported
      - status
      - similarity
      - keyword_grounding
      title: EvidenceItem
    FlaggedSpan:
      properties:
        text:
          type: string
          title: Text
        reason:
          type: string
          title: Reason
        start:
          anyOf:
          - type: integer
          - type: 'null'
          title: Start
        end:
          anyOf:
          - type: integer
          - type: 'null'
          title: End
        severity:
          type: string
          enum:
          - low
          - medium
          - high
          title: Severity
          default: medium
        claim_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Claim Type
        best_evidence:
          anyOf:
          - type: string
          - type: 'null'
          title: Best Evidence
        best_similarity:
          anyOf:
          - type: number
          - type: 'null'
          title: Best Similarity
      type: object
      required:
      - text
      - reason
      title: FlaggedSpan
      description: Exactly the shape PS2's API contract requires, plus optional offsets.
    GenerateAndVerifyRequest:
      properties:
        seed_question:
          type: string
          minLength: 5
          title: Seed Question
        domain:
          type: string
          title: Domain
          default: programming
        count:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Count
          default: 5
        difficulty_shift:
          anyOf:
          - type: string
            enum:
            - easy
            - medium
            - hard
            - expert
          - type: 'null'
          title: Difficulty Shift
        enable_regeneration:
          type: boolean
          title: Enable Regeneration
          default: true
        persist:
          type: boolean
          title: Persist
          description: Write accepted/review results to local JSON stores.
          default: true
        job_id:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
          - type: 'null'
          title: Job Id
          description: Optional client-chosen id; poll GET /progress/{job_id} while
            it runs.
      type: object
      required:
      - seed_question
      title: GenerateAndVerifyRequest
    GenerateAndVerifyResponse:
      properties:
        seed_metadata:
          anyOf:
          - $ref: '#/components/schemas/SeedMetadata'
          - type: 'null'
        results:
          items:
            $ref: '#/components/schemas/PipelineCandidate'
          type: array
          title: Results
        summary:
          $ref: '#/components/schemas/PipelineSummary'
        timings_ms:
          additionalProperties:
            type: number
          type: object
          title: Timings Ms
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        demo:
          type: boolean
          title: Demo
          default: false
        demo_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Demo Label
        demo_description:
          anyOf:
          - type: string
          - type: 'null'
          title: Demo Description
      type: object
      required:
      - results
      - summary
      title: GenerateAndVerifyResponse
    GenerateRequest:
      properties:
        seed_question:
          type: string
          minLength: 5
          title: Seed Question
        domain:
          type: string
          title: Domain
          default: programming
        count:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Count
          default: 10
        difficulty_shift:
          anyOf:
          - type: string
            enum:
            - easy
            - medium
            - hard
            - expert
          - type: 'null'
          title: Difficulty Shift
          description: Request an explicit difficulty shift. None preserves the seed's.
        regenerate:
          type: boolean
          title: Regenerate
          description: Regenerate structurally rejected candidates from their rejection
            reasons, up to max_regeneration_attempts each.
          default: true
      type: object
      required:
      - seed_question
      title: GenerateRequest
    GenerateResponse:
      properties:
        variations:
          items:
            $ref: '#/components/schemas/GenerateVariation'
          type: array
